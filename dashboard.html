<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>STEES — Device</title>
<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    background: #0B1922;
    color: #F1F5F9;
    display: flex; justify-content: center; align-items: center;
    min-height: 100vh; padding: 20px;
  }
  .container { max-width: 480px; width: 100%; }

  .head {
    display: flex; align-items: center; gap: 14px;
    margin-bottom: 6px;
  }
  .logo {
    width: 44px; height: 44px; border-radius: 50%;
    background: linear-gradient(135deg, #2DD4BF, #34D399);
    display: flex; align-items: center; justify-content: center;
    font-family: 'Sora', sans-serif; font-weight: 700; font-size: 20px;
    color: #0B1922;
    box-shadow: 0 0 20px rgba(45, 212, 191, 0.3);
    flex-shrink: 0;
  }
  .head-text h1 {
    font-family: 'Sora', sans-serif; font-size: 20px; font-weight: 700;
    letter-spacing: 2px; color: #F1F5F9; line-height: 1.2;
  }
  .head-text p {
    font-size: 11px; color: #94A3B8; letter-spacing: 0.5px;
  }
  .badge {
    display: flex; align-items: center; gap: 8px;
    margin-left: auto; font-size: 12px;
  }
  .droplet {
    width: 10px; height: 10px; border-radius: 50%;
    transition: all 0.5s;
  }
  .droplet.green { background: #2DD4BF; box-shadow: 0 0 10px rgba(45, 212, 191, 0.5); }
  .droplet.yellow { background: #FBBF24; box-shadow: 0 0 10px rgba(251, 191, 36, 0.4); }
  .droplet.red { background: #EF4444; box-shadow: 0 0 10px rgba(239, 68, 68, 0.4); }

  .device-id {
    font-family: 'Inter', monospace; font-size: 12px;
    color: #94A3B8; margin-bottom: 12px;
    letter-spacing: 0.3px;
  }
  .device-id span { color: #2DD4BF; }

  .card {
    cursor: pointer;
    background: #1A2D3D;
    border-radius: 24px;
    padding: 20px;
    margin-bottom: 12px;
    display: flex; align-items: center;
    justify-content: space-between;
    transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    border: 1.5px solid rgba(255,255,255,0.06);
    user-select: none;
    position: relative;
    overflow: hidden;
  }
  .card.on {
    border-color: var(--c);
    background: color-mix(in srgb, var(--c) 10%, #1A2D3D);
    box-shadow: 0 0 24px color-mix(in srgb, var(--c) 15%, transparent);
  }
  .card:active { transform: scale(0.97); }

  .card.on::after {
    content: '';
    position: absolute; bottom: 0; left: 0; right: 0; height: 3px;
    background: linear-gradient(90deg, transparent, var(--c), transparent);
    animation: flow 2s ease-in-out infinite;
  }
  @keyframes flow {
    0% { transform: translateX(-100%); opacity: 0; }
    50% { opacity: 1; }
    100% { transform: translateX(100%); opacity: 0; }
  }

  .info { display: flex; align-items: center; gap: 14px; position: relative; z-index: 1; }
  .icon { font-size: 28px; }
  .name { font-family: 'Sora', sans-serif; font-size: 14px; font-weight: 600; }
  .ch { font-size: 10px; color: #94A3B8; letter-spacing: 1.2px; margin-top: 2px; }
  .ch.on { color: var(--c); }

  .state {
    padding: 6px 16px; border-radius: 20px;
    font-family: 'Inter', sans-serif; font-size: 11px;
    font-weight: 600; letter-spacing: 1.2px;
    transition: all 0.3s;
    position: relative; z-index: 1;
  }
  .state.on { background: var(--c); color: #0B1922; }
  .state.off { background: rgba(148, 163, 184, 0.1); color: #94A3B8; }

  .footer { text-align: center; margin-top: 16px; font-size: 11px; color: #4A5A6A; }
</style>
</head>
<body>
<div class="container">
  <div class="head">
    <div class="logo">S</div>
    <div class="head-text">
      <h1>STEES</h1>
      <p>Smart Irrigation</p>
    </div>
    <div class="badge">
      <span class="droplet red" id="statusDot"></span>
      <span id="statusText" style="color:#94A3B8;">Connecting...</span>
    </div>
  </div>
  <p class="device-id">Device · <span id="deviceIdLabel">—</span></p>
  <div id="cards"></div>
  <p class="footer" id="log">—</p>
</div>

<script>
  const params = new URLSearchParams(window.location.search);
  const DEVICE_ID = params.get('deviceId') || 'smarthome';
  document.getElementById('deviceIdLabel').textContent = DEVICE_ID;

  const channels = [
    { id: 1, name: 'Zone 1', icon: '💧', color: '#2DD4BF' },
    { id: 2, name: 'Zone 2', icon: '💧', color: '#2DD4BF' },
    { id: 3, name: 'Zone 3', icon: '💧', color: '#2DD4BF' },
    { id: 4, name: 'Zone 4', icon: '💧', color: '#2DD4BF' },
  ];
  const states = { 1: 'OFF', 2: 'OFF', 3: 'OFF', 4: 'OFF' };
  const dot = document.getElementById('statusDot');
  const text = document.getElementById('statusText');
  const log = document.getElementById('log');
  let mqttClient = null;

  function logMsg(msg) { log.textContent = msg; }

  function render() {
    document.getElementById('cards').innerHTML = channels.map(ch => {
      const on = states[ch.id] === 'ON';
      return `<div class="card ${on ? 'on' : ''}" style="--c:${ch.color}" onclick="toggle(${ch.id})">
        <div class="info">
          <div class="icon">${ch.icon}</div>
          <div>
            <div class="name" style="color:${on ? ch.color : '#F1F5F9'}">${ch.name}</div>
            <div class="ch ${on ? 'on' : ''}" style="--c:${ch.color}">ZONE ${ch.id}</div>
          </div>
        </div>
        <div class="state ${on ? 'on' : 'off'}" style="--c:${ch.color}">
          ${on ? 'FLOWING' : 'DRY'}
        </div>
      </div>`;
    }).join('');
  }

  function setStatus(color, label) {
    dot.className = 'droplet ' + color;
    text.textContent = label;
  }

  function startMQTT() {
    const url = 'wss://5a86e38080744eb89c62cd93cf7b9249.s1.eu.hivemq.cloud:8884/mqtt';
    mqttClient = mqtt.connect(url, { username: 'raouf', password: 'raouf2003' });

    mqttClient.on('connect', () => {
      setStatus('green', 'Connected');
      logMsg('Listening on ' + DEVICE_ID + '...');
      mqttClient.subscribe('cmnd/' + DEVICE_ID + '/+', (err) => {
        if (err) logMsg('Subscribe error');
      });
    });

    mqttClient.on('message', (topic, message) => {
      const t = topic.toString();
      const payload = message.toString().trim().toUpperCase();
      const match = t.match(new RegExp('^cmnd\\/' + DEVICE_ID + '\\/POWER(\\d)$'));
      if (!match || !['ON','OFF'].includes(payload)) return;
      const ch = parseInt(match[1]);
      if (ch < 1 || ch > 4) return;
      states[ch] = payload;
      render();
      logMsg('Zone ' + ch + ' \u2192 ' + payload);
      mqttClient.publish('stat/' + DEVICE_ID + '/RESULT', JSON.stringify({ ['POWER' + ch]: payload }));
    });

    mqttClient.on('error', (err) => {
      logMsg('MQTT error: ' + err.message);
      setStatus('red', 'Error');
    });
    mqttClient.on('close', () => setStatus('red', 'Disconnected'));
  }

  function startSocketIO() {
    const socket = io('https://sonoff.onrender.com', { transports: ['websocket'] });
    socket.on('connect', () => {
      if (!mqttClient || !mqttClient.connected) setStatus('yellow', 'Relay');
    });
    socket.on('device_update', (data) => {
      if (data.deviceId !== DEVICE_ID) return;
      states[data.channel] = data.state;
      render();
      logMsg('Zone ' + data.channel + ' \u2192 ' + data.state + ' (synced)');
    });
  }

  function toggle(ch) {
    if (!mqttClient || !mqttClient.connected) {
      logMsg('MQTT disconnected');
      return;
    }
    const newState = states[ch] === 'ON' ? 'OFF' : 'ON';
    states[ch] = newState;
    render();
    mqttClient.publish('cmnd/' + DEVICE_ID + '/POWER' + ch, newState);
    mqttClient.publish('stat/' + DEVICE_ID + '/RESULT', JSON.stringify({ ['POWER' + ch]: newState }));
    logMsg('Zone ' + ch + ' \u2192 ' + newState);
  }

  startMQTT();
  startSocketIO();
  render();
</script>
</body>
</html>
